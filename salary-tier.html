<!DOCTYPE html>
<html>
<head>
    <title>Salary Tier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="fade-in">

<!-- NAVBAR -->
<div class="navbar">
  <a href="/dashboard">Home</a>
  <a href="/employee">Employee</a>
  <a href="/salary-tier">Salary</a>
  <a href="/salary-summary">Summary</a>
  <a href="/logout">Logout</a>
</div>

<!-- CONTAINER -->
<div class="container">
    <h2>Define Salary Tier</h2>
    <form method="post" id="tierForm">
        <input name="tier" placeholder="Tier (Tier 1)" required>
        <input name="basic" placeholder="Basic Salary" required>
        <input name="hra" placeholder="HRA" required>
        <input name="allowances" placeholder="Allowances" required>
        <button type="submit">Save</button>
    </form>
</div>

<!-- ENTER KEY HANDLER -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll("#tierForm input");
    const form = document.getElementById("tierForm");

    inputs.forEach((input, index) => {
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Stop auto-submit

                if (index < inputs.length - 1) {
                    // Move to next input
                    inputs[index + 1].focus();
                } else {
                    // Last input → submit form
                    form.submit();
                }
            }
        });
    });
});
</script>

</body>
</html>
